<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIFA Football Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg-1: #07131d;
        --bg-2: #0d2432;
        --card-1: #0f6d4d;
        --card-2: #0a3d2e;
        --gold: #f9d77e;
        --gold-2: #f5b642;
        --white: #f4f8fb;
        --text: #e8f6ff;
        --muted: #9ab5c4;
        --green: #52d88d;
        --blue: #6ec7ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(73, 123, 137, 0.28), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--white);
      }

      .card-shell {
        position: relative;
        padding: 22px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        box-shadow:
          0 25px 55px rgba(0, 0, 0, 0.42),
          inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .card {
        position: relative;
        width: 420px;
        height: 620px;
        border-radius: 30px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.12)),
          linear-gradient(135deg, var(--card-1), var(--card-2));
        box-shadow:
          0 18px 40px rgba(0,0,0,0.35),
          inset 0 0 0 1px rgba(255,255,255,0.12);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.14) 35%, transparent 55%);
        transform: translateX(-100%);
        animation: shine 6s ease-in-out infinite;
      }

      @keyframes shine {
        0%, 100% { transform: translateX(-100%); }
        35%, 60% { transform: translateX(100%); }
      }

      .top-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px 0;
        z-index: 2;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        display: grid;
        place-items: center;
        color: #0d2135;
        font-weight: 900;
        font-size: 16px;
      }

      .fifa-tag {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--gold);
        text-transform: uppercase;
      }

      .player-wrap {
        position: absolute;
        inset: 52px 0 0 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        z-index: 1;
      }

      .player-photo {
        width: 360px;
        height: 420px;
        object-fit: cover;
        object-position: center top;
        filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.35));
        border-radius: 30px 30px 0 0;
        transform: scale(1.08);
      }

      .player-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        left: 50%;
        top: 150px;
        transform: translateX(-50%);
        background: radial-gradient(circle, rgba(86, 240, 164, 0.38), rgba(86,240,164,0.0) 70%);
        filter: blur(30px);
        z-index: 0;
      }

      .club-badge {
        position: absolute;
        left: 18px;
        top: 96px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.18);
        color: var(--white);
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 999px;
        letter-spacing: 1px;
        font-size: 11px;
        text-transform: uppercase;
        z-index: 3;
      }

      .country {
        position: absolute;
        right: 18px;
        top: 96px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        font-weight: 700;
        color: #dfeaf0;
      }

      .flag {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background:
          linear-gradient(90deg, #4d9cff 0 50%, #f0f4f8 50% 100%);
        position: relative;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
      }

      .flag::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 0 50%, rgba(255,255,255,0.2) 50% 100%);
      }

      .bottom-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 22px 18px 18px;
        background: linear-gradient(180deg, rgba(8, 16, 19, 0.1), rgba(7,14,17,0.72) 18%, rgba(4,10,12,0.9) 100%);
        z-index: 4;
      }

      .meta-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
      }

      .role {
        display: inline-block;
        margin-bottom: 10px;
        padding: 6px 10px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--gold);
      }

      .player-name {
        margin: 0;
        font-size: 38px;
        letter-spacing: 1px;
        line-height: 0.9;
        font-weight: 900;
        text-transform: uppercase;
      }

      .rating {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff7cf, #f6cb5f 28%, #d79d21 60%, #8c5d0f 100%);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 30px;
        color: #14263f;
        box-shadow:
          inset 0 0 0 8px rgba(255,255,255,0.2),
          0 8px 18px rgba(0,0,0,0.2);
      }

      .info-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 18px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.12);
      }

      .info-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .info-label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .info-value {
        font-size: 18px;
        font-weight: 800;
      }

      .stats {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }

      .stat {
        display: grid;
        grid-template-columns: 46px 1fr 38px;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat strong {
        color: var(--white);
        font-weight: 800;
        text-align: right;
      }

      .bar {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.12);
        border-radius: 25px;
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b8ff66, #fff2a1, #f9d77e);
      }

      @media (max-width: 500px) {
        .card {
          width: 360px;
          height: 580px;
        }

        .player-photo {
          width: 320px;
          height: 380px;
        }

        .player-name {
          font-size: 32px;
        }

        .rating {
          width: 76px;
          height: 76px;
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card-shell">
      <div class="card">
        <div class="top-bar">
          <div class="brand">
            <span class="brand-mark">F</span>
            <span>FIFA</span>
          </div>
          <div class="fifa-tag">Ultimate</div>
        </div>

        <div class="player-glow"></div>

        <div class="club-badge">Real Madrid</div>

        <div class="country">
          <span class="flag"></span>
          <span>France</span>
        </div>

        <div class="player-wrap">
          <img
            class="player-photo"
            src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?auto=format&fit=crop&w=900&q=80"
            alt="Football player"
          />
        </div>

        <div class="bottom-panel">
          <div class="meta-row">
            <div>
              <span class="role">Forward</span>
              <h1 class="player-name">Mbappé</h1>
            </div>
            <div class="rating">97</div>
          </div>

          <div class="info-row">
            <div class="info-box">
              <span class="info-label">Height</span>
              <span class="info-value">178cm</span>
            </div>
            <div class="info-box">
              <span class="info-label">Weight</span>
              <span class="info-value">73kg</span>
            </div>
            <div class="info-box">
              <span class="info-label">Foot</span>
              <span class="info-value">Right</span>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <span>PAC</span>
              <div class="bar"><i style="width: 97%;"></i></div>
              <strong>97</strong>
            </div>

            <div class="stat">
              <span>SHO</span>
              <div class="bar"><i style="width: 92%;"></i></div>
              <strong>92</strong>
            </div>

            <div class="stat">
              <span>PAS</span>
              <div class="bar"><i style="width: 88%;"></i></div>
              <strong>88</strong>
            </div>

            <div class="stat">
              <span>DRI</span>
              <div class="bar"><i style="width: 95%;"></i></div>
              <strong>95</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
