<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subzero</title>
  <style>
    :root {
      --sky-top: #dff7ff;
      --sky-mid: #a7e5ff;
      --sky-bottom: #4c9bcc;
      --ice: #dffcff;
      --ice-2: #8ee8ff;
      --ice-3: #59c7ff;
      --ground: #183d58;
      --ground-2: #245d7d;
      --danger: #f07182;
      --danger-2: #cf4c67;
      --panel: rgba(9, 27, 39, 0.7);
      --text: #ebffff;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #dff7ff, #abebff, #70bfdc);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    #gameWrap {
      position: relative;
      width: min(92vw, 960px);
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(7, 26, 40, 0.42);
      border: 3px solid rgba(255,255,255,0.32);
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid), var(--sky-bottom));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .score {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(8, 24, 36, 0.42);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 10px 14px;
      letter-spacing: 0.06em;
      font-weight: 800;
      box-shadow: 0 12px 22px rgba(0,0,0,0.18);
    }

    .score small {
      display: block;
      margin-bottom: 2px;
      font-size: 10px;
      opacity: 0.8;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(6, 18, 26, 0.12);
      backdrop-filter: blur(2px);
    }

    .screen.hidden { display: none; }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      min-width: min(72vw, 360px);
      padding: 26px 22px 20px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.2);
    }

    .title {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 12px 22px rgba(0,0,0,0.26);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.96rem;
      color: rgba(255,255,255,0.8);
    }

    .button {
      pointer-events: auto;
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #153d58;
      background: linear-gradient(180deg, #e8ffff, #8fe7ff);
      box-shadow: 0 12px 22px rgba(143,231,255,0.4);
      cursor: pointer;
    }

    .button:active { transform: translateY(1px) scale(0.99); }

    .best {
      margin-top: 12px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.82);
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div class="hud">
      <div class="score">
        <small>SCORE</small>
        <span id="scoreText">0</span>
      </div>
    </div>

    <div id="startScreen" class="screen">
      <div class="panel">
        <h1 class="title">Subzero</h1>
        <p class="subtitle">Press Space / Click / Tap to jump</p>
        <button id="startButton" class="button">Start</button>
        <div id="bestText" class="best">Best: 0</div>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="panel">
        <h2 class="title" style="font-size: clamp(1.7rem, 3vw, 2.5rem);">Game Over</h2>
        <p class="subtitle" id="finalScore">Score: 0</p>
        <button id="restartButton" class="button">Retry</button>
        <div id="bestText2" class="best">Best: 0</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("scoreText");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");
    const bestText = document.getElementById("bestText");
    const bestText2 = document.getElementById("bestText2");
    const finalScore = document.getElementById("finalScore");

    const WORLD = {
      width: canvas.width,
      height: canvas.height,
      floorY: canvas.height - 76
    };

    let state = "ready";
    let score = 0;
    let best = Number(localStorage.getItem("subzero-best") || 0);

    const player = {
      x: 120,
      y: WORLD.floorY - 28,
      w: 30,
      h: 28,
      vy: 0,
      gravity: 0.72,
      jumpForce: -14.5,
      grounded: true
    };

    let obstacles = [];
    let particles = [];
    let snow = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let speed = 6;

    function resetPlayer() {
      player.y = WORLD.floorY - player.h;
      player.vy = 0;
      player.grounded = true;
    }

    function startGame() {
      state = "playing";
      score = 0;
      scoreText.textContent = "0";
      obstacles = [];
      particles = [];
      snow = [];
      spawnTimer = 50;
      speed = 6;
      resetPlayer();
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
    }

    function endGame() {
      state = "gameover";
      best = Math.max(best, Math.floor(score));
      localStorage.setItem("subzero-best", String(best));

      bestText.textContent = "Best: " + best;
      bestText2.textContent = "Best: " + best;
      finalScore.textContent = "Score: " + Math.floor(score);

      gameOverScreen.classList.remove("hidden");
    }

    function jump() {
      if (state === "ready") {
        startGame();
        return;
      }

      if (state === "gameover") {
        startGame();
        return;
      }

      if (player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
        burstParticles(player.x + player.w / 2, player.y + player.h, "#eaffff", 14);
      }
    }

    function burstParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: -Math.random() * 3.5 - 0.8,
          life: 24 + Math.random() * 18,
          color,
          size: 2 + Math.random() * 5
        });
      }
    }

    function randomBetween(a, b) {
      return a + Math.random() * (b - a);
    }

    function makeSnow() {
      for (let i = 0; i < 80; i++) {
        snow.push({
          x: Math.random() * WORLD.width,
          y: Math.random() * WORLD.height,
          r: Math.random() * 2.5 + 1.5,
          speed: Math.random() * 1.8 + 0.8
        });
      }
    }

    function spawnObstacle() {
      const type = Math.random() < 0.7 ? "ice" : "block";

      if (type === "ice") {
        obstacles.push({
          x: WORLD.width + 30,
          y: WORLD.floorY - (28 + Math.random() * 58),
          w: 22 + Math.random() * 34,
          h: 34 + Math.random() * 58,
          color: "#f07282"
        });
      } else {
        obstacles.push({
          x: WORLD.width + 30,
          y: WORLD.floorY - (30 + Math.random() * 70),
          w: 24 + Math.random() * 38,
          h: 26 + Math.random() * 60,
          color: "#8fe7ff"
        });
      }
    }

    function updateSnow() {
      for (const flake of snow) {
        flake.y += flake.speed;
        flake.x -= 0.25;

        if (flake.y > WORLD.height) {
          flake.y = -10;
          flake.x = Math.random() * WORLD.width;
        }

        if (flake.x < -5) {
          flake.x = WORLD.width + 5;
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.13;
        p.life -= 1;

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updatePlayer(dt) {
      player.vy += player.gravity * dt;
      player.y += player.vy * dt;

      if (player.y + player.h >= WORLD.floorY) {
        player.y = WORLD.floorY - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }

    function updateObstacles(dt) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = randomBetween(52, 96);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed * dt;

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function intersects(a, b) {
      return !(
        a.x + a.w < b.x ||
        a.x > b.x + b.w ||
        a.y + a.h < b.y ||
        a.y > b.y + b.h
      );
    }

    function checkCollision() {
      const p = {
        x: player.x,
        y: player.y,
        w: player.w,
        h: player.h
      };

      for (const obs of obstacles) {
        const o = {
          x: obs.x,
          y: obs.y,
          w: obs.w,
          h: obs.h
        };

        if (intersects(p, o)) {
          endGame();
          return;
        }
      }
    }

    function updateGame(dt) {
      if (state !== "playing") return;

      speed += 0.003 * dt;
      score += dt * 0.12;
      scoreText.textContent = Math.floor(score);

      updatePlayer(dt);
      updateObstacles(dt);
      updateParticles();
      updateSnow();
      checkCollision();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, WORLD.height);
      sky.addColorStop(0, "#dff7ff");
      sky.addColorStop(0.55, "#a7e5ff");
      sky.addColorStop(1, "#4d99c9");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WORLD.width, WORLD.height);

      for (let x = 0; x < WORLD.width; x += 36) {
        ctx.strokeStyle = "rgba(255,255,255,0.12)";
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD.height);
        ctx.stroke();
      }

      for (let y = 0; y < WORLD.height; y += 36) {
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.width, y);
        ctx.stroke();
      }
    }

    function drawSnow() {
      for (const flake of snow) {
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGround() {
      ctx.fillStyle = "#183d58";
      ctx.fillRect(0, WORLD.floorY, WORLD.width, WORLD.height - WORLD.floorY);

      ctx.fillStyle = "#235f7d";
      ctx.fillRect(0, WORLD.floorY, WORLD.width, 8);

      ctx.fillStyle = "rgba(255,255,255,0.09)";
      for (let x = 0; x < WORLD.width + 50; x += 34) {
        ctx.fillRect(x + ((score * 6) % 34), WORLD.floorY + 18, 18, 10);
      }
    }

    function drawPlayer() {
      const px = player.x;
      const py = player.y;

      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(px - 6, py - 6, player.w + 12, player.h + 12);

      ctx.fillStyle = "#ebffff";
      ctx.fillRect(px, py, player.w, player.h);

      ctx.fillStyle = "#8fe7ff";
      ctx.fillRect(px + 5, py + 4, player.w - 10, player.h - 8);

      ctx.fillStyle = "#113d5c";
      ctx.fillRect(px + 7, py + 8, 4, 4);
      ctx.fillRect(px + 18, py + 8, 4, 4);

      ctx.fillStyle = "#58c7ff";
      ctx.fillRect(px + 10, py + 17, player.w - 20, 4);
    }

    function drawIceObstacle(obs) {
      const x = obs.x;
      const y = obs.y;
      const w = obs.w;
      const h = obs.h;

      ctx.fillStyle = obs.color;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath();
      ctx.moveTo(x + w * 0.25, y + h * 0.7);
      ctx.lineTo(x + w / 2, y + h * 0.18);
      ctx.lineTo(x + w * 0.72, y + h * 0.7);
      ctx.closePath();
      ctx.fill();
    }

    function drawBlockObstacle(obs) {
      const x = obs.x;
      const y = obs.y;
      const w = obs.w;
      const h = obs.h;

      ctx.fillStyle = obs.color;
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(x + 4, y + 4, w - 8, 6);
    }

    function drawObstacles() {
      for (const obs of obstacles) {
        if (obs.color === "#f07282") {
          drawIceObstacle(obs);
        } else {
          drawBlockObstacle(obs);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }
    }

    function render() {
      drawBackground();
      drawSnow();
      drawGround();
      drawObstacles();
      drawParticles();
      drawPlayer();
    }

    function frame(ts) {
      const dt = Math.min((ts - lastTime) / 16.67 || 1, 2.2);
      lastTime = ts;
      updateGame(dt);
      render();
      requestAnimationFrame(frame);
    }

    function handlePointer(e) {
      e.preventDefault();
      jump();
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener("pointerdown", handlePointer);
    window.addEventListener("pointerdown", (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        jump();
      }
    });

    startButton.addEventListener("click", startGame);
    restartButton.addEventListener("click", startGame);

    bestText.textContent = "Best: " + best;
    bestText2.textContent = "Best: " + best;

    makeSnow();
    resetPlayer();
    render();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
