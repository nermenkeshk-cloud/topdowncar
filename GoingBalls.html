<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Going Balls Style</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1320;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    #game {
      width: min(92vw, 720px);
      height: min(92vh, 760px);
      display: block;
      border-radius: 18px;
      box-shadow: 0 25px 55px rgba(0,0,0,0.45);
      background: #1bb3d4;
      border: 4px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <canvas id="game" width="720" height="760"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const bridge = {
      x: 90, y: 430, w: 540, h: 120
    };

    const ball = {
      x: W / 2,
      y: bridge.y - 58,
      r: 78,
      vx: 0,
      vy: 0,
      spin: 0
    };

    const particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.1
      });
    }

    function drawWaterBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "#2bd0e7");
      grad.addColorStop(0.4, "#27c9e6");
      grad.addColorStop(1, "#0f9ec5");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // water shimmer
      for (let i = 0; i < 26; i++) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${0.08 + i * 0.005})`;
        ctx.arc(i * 30 + 18, 90 + Math.sin(i * 1.7) * 18, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      // dark leafy side shapes to mimic the image
      ctx.fillStyle = "rgba(12, 96, 118, 0.65)";
      ctx.beginPath();
      ctx.moveTo(0, 340);
      ctx.bezierCurveTo(30, 250, 80, 220, 150, 260);
      ctx.bezierCurveTo(170, 170, 220, 160, 270, 200);
      ctx.bezierCurveTo(330, 250, 350, 300, 420, 330);
      ctx.bezierCurveTo(470, 340, 520, 260, 560, 210);
      ctx.bezierCurveTo(620, 180, 680, 200, 720, 270);
      ctx.lineTo(720, 450);
      ctx.lineTo(0, 450);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(8, 92, 112, 0.7)";
      ctx.beginPath();
      ctx.moveTo(0, 410);
      ctx.quadraticCurveTo(160, 250, 260, 350);
      ctx.quadraticCurveTo(410, 470, 540, 390);
      ctx.quadraticCurveTo(620, 330, 720, 420);
      ctx.lineTo(720, 760);
      ctx.lineTo(0, 760);
      ctx.closePath();
      ctx.fill();
    }

    function drawBridge() {
      // bridge base
      ctx.fillStyle = "#7b4a1a";
      ctx.fillRect(bridge.x - 20, bridge.y + 18, bridge.w + 40, 32);

      // wooden planks
      for (let i = 0; i < 15; i++) {
        const px = bridge.x + i * 38;
        ctx.fillStyle = i % 2 === 0 ? "#a06c35" : "#8d5a2c";
        ctx.fillRect(px, bridge.y, 30, bridge.h);
      }

      // top surface
      ctx.fillStyle = "#b88243";
      ctx.fillRect(bridge.x, bridge.y, bridge.w, 26);

      // side rails
      ctx.strokeStyle = "#5d3a1a";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(bridge.x, bridge.y);
      ctx.lineTo(bridge.x, bridge.y + bridge.h);
      ctx.moveTo(bridge.x + bridge.w, bridge.y);
      ctx.lineTo(bridge.x + bridge.w, bridge.y + bridge.h);
      ctx.stroke();

      // decorative slats
      ctx.strokeStyle = "rgba(75, 44, 18, 0.7)";
      ctx.lineWidth = 3;
      for (let i = 0; i <= 12; i++) {
        const x = bridge.x + i * 42;
        ctx.beginPath();
        ctx.moveTo(x, bridge.y);
        ctx.lineTo(x, bridge.y + bridge.h);
        ctx.stroke();
      }
    }

    function drawBall() {
      const x = ball.x;
      const y = ball.y;
      const r = ball.r;

      // outer glow
      ctx.beginPath();
      ctx.arc(x, y, r + 20, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(70, 255, 160, 0.15)";
      ctx.fill();

      // shadow
      ctx.beginPath();
      ctx.ellipse(x + 12, y + r + 12, r * 0.82, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(10, 44, 60, 0.22)";
      ctx.fill();

      // ball body
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = "#1c2336";
      ctx.fill();

      // hexagonal pattern
      for (let iy = -3; iy <= 3; iy++) {
        for (let ix = -4; ix <= 4; ix++) {
          const px = x + ix * 18 + (iy % 2 === 0 ? 9 : 0);
          const py = y + iy * 16;
          drawHexDot(px, py, 8, "#a8f4ff");
        }
      }

      // green glowing section
      ctx.beginPath();
      ctx.arc(x, y, r * 0.74, -Math.PI / 2, Math.PI / 2);
      ctx.fillStyle = "rgba(74, 255, 185, 0.85)";
      ctx.fill();

      // highlight
      ctx.beginPath();
      ctx.arc(x - r * 0.22, y - r * 0.25, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fill();

      // little light spots
      for (let i = 0; i < 5; i++) {
        const offX = x - r * 0.5 + i * 18;
        const offY = y - r * 0.3 + (i % 2 === 0 ? 12 : -8);
        ctx.beginPath();
        ctx.arc(offX, offY, 5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(120, 255, 200, 0.8)";
        ctx.fill();
      }
    }

    function drawHexDot(cx, cy, size, color) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const x = cx + Math.cos(angle) * size;
        const y = cy + Math.sin(angle) * size;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        ctx.fill();
      }
    }

    function update() {
      const move = (keys["arrowleft"] || keys["a"] ? -1 : 0) + (keys["arrowright"] || keys["d"] ? 1 : 0);
      ball.vx += move * 0.26;
      ball.vx *= 0.9;

      ball.x += ball.vx;
      ball.spin += Math.abs(ball.vx) * 0.08;

      // keep ball on bridge
      const minX = bridge.x + ball.r + 18;
      const maxX = bridge.x + bridge.w - ball.r - 18;
      if (ball.x < minX) {
        ball.x = minX;
        ball.vx *= -0.5;
      }
      if (ball.x > maxX) {
        ball.x = maxX;
        ball.vx *= -0.5;
      }

      ball.y = bridge.y - ball.r + 8;

      // drifting effect from the water
      const drift = Math.sin((performance.now() * 0.0025) + ball.x * 0.02) * 2.2;
      ball.y += drift;

      // particle motion
      for (const p of particles) {
        p.y += p.speed;
        if (p.y > H) {
          p.y = -5;
          p.x = Math.random() * W;
        }
      }
    }

    function render() {
      drawWaterBackground();
      drawParticles();
      drawBridge();
      drawBall();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
