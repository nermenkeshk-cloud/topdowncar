<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarKing Arena</title>
  <style>
    :root{
      --bg:#060b18;
      --panel:#111a2e;
      --panel2:#162544;
      --line:#2c4c7c;
      --text:#edf6ff;
      --muted:#9ab4d0;
      --cyan:#63d7ff;
      --green:#6fffb0;
      --red:#ff5d7a;
      --yellow:#ffd76d;
      --purple:#bf8bff;
      --shadow:0 0 30px rgba(99,215,255,.25);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      height:100%;
      font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(93,130,255,.18), transparent 35%),
        radial-gradient(circle at bottom, rgba(99,215,255,.12), transparent 30%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.8) 0, transparent 100%),
        radial-gradient(2px 2px at 75% 20%, rgba(255,255,255,.7) 0, transparent 100%),
        radial-gradient(2px 2px at 60% 80%, rgba(255,255,255,.7) 0, transparent 100%),
        radial-gradient(2px 2px at 35% 70%, rgba(255,255,255,.8) 0, transparent 100%);
      opacity:.7;
      pointer-events:none;
    }

    .app{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns: 280px 1fr 320px;
      gap:18px;
      padding:18px;
      position:relative;
      z-index:1;
    }

    .panel{
      background:rgba(17,26,46,.9);
      border:1px solid rgba(114,150,220,.28);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }

    .left, .right{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .title{
      font-size:1.65rem;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--cyan);
      text-shadow:0 0 18px rgba(99,215,255,.5);
    }

    .subtitle{
      color:var(--muted);
      font-size:.8rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .status-box{
      background:linear-gradient(180deg, rgba(19,31,53,.95), rgba(12,30,45,.95));
      border:1px solid rgba(99,215,255,.2);
      border-radius:14px;
      padding:14px 16px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:8px 0;
      font-size:.95rem;
      color:var(--text);
    }

    .tag{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:999px;
      padding:6px 10px;
      font-size:.75rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .tag.green{color:var(--green); border-color:rgba(111,255,176,.4); background:rgba(111,255,176,.08)}
    .tag.red{color:var(--red); border-color:rgba(255,93,122,.4); background:rgba(255,93,122,.08)}
    .tag.yellow{color:var(--yellow); border-color:rgba(255,215,109,.38); background:rgba(255,215,109,.08)}
    .tag.purple{color:var(--purple); border-color:rgba(191,139,255,.4); background:rgba(191,139,255,.08)}

    .crew-card{
      display:flex;
      gap:12px;
      align-items:center;
      padding:12px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.025);
      border-radius:14px;
    }

    .avatar{
      width:54px;
      height:54px;
      border-radius:16px;
      position:relative;
      background:linear-gradient(135deg, var(--cyan), #2b5ef7);
      box-shadow:0 0 14px rgba(99,215,255,.35);
      overflow:hidden;
    }

    .avatar::before{
      content:"";
      position:absolute;
      left:14px; top:14px;
      width:26px; height:18px;
      border-radius:50% 50% 42% 42%;
      background:#fff;
      box-shadow:0 10px 0 6px rgba(255,255,255,.14);
    }

    .avatar::after{
      content:"";
      position:absolute;
      left:18px; bottom:8px;
      width:18px; height:12px;
      border-radius:50%;
      background:#0d1a2f;
      box-shadow:0 -2px 0 2px rgba(255,255,255,.18);
    }

    .avatar.red{
      background:linear-gradient(135deg, #ff7b8b, #dc1e4f);
    }

    .avatar.yellow{
      background:linear-gradient(135deg, #ffe08a, #ffb107);
    }

    .avatar.green{
      background:linear-gradient(135deg, #84ffbd, #2ac67e);
    }

    .crew-name{
      font-size:1rem;
      font-weight:700;
    }

    .crew-role{
      color:var(--muted);
      font-size:.8rem;
      margin-top:2px;
    }

    .map-panel{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .map{
      position:relative;
      border-radius:18px;
      border:1px solid rgba(99,215,255,.18);
      background:
        linear-gradient(180deg, rgba(13,20,36,.94), rgba(8,12,21,.97)),
        repeating-linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.03) 2px, transparent 2px, transparent 24px);
      min-height:420px;
      overflow:hidden;
      box-shadow:inset 0 0 18px rgba(99,215,255,.08);
    }

    .map::before{
      content:"";
      position:absolute;
      inset:12px;
      border-radius:16px;
      border:1px solid rgba(99,215,255,.14);
      background:
        linear-gradient(90deg, transparent 0 18%, rgba(99,215,255,.08) 18% 22%, transparent 22% 38%, rgba(99,215,255,.08) 38% 42%, transparent 42% 58%, rgba(99,215,255,.08) 58% 62%, transparent 62% 78%, rgba(99,215,255,.08) 78% 82%, transparent 82% 100%),
        linear-gradient(transparent 0 18%, rgba(99,215,255,.08) 18% 22%, transparent 22% 38%, rgba(99,215,255,.08) 38% 42%, transparent 42% 58%, rgba(99,215,255,.08) 58% 62%, transparent 62% 78%, rgba(99,215,255,.08) 78% 82%, transparent 82% 100%);
      opacity:.8;
    }

    .room{
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:.62rem;
      color:var(--muted);
      border:1px solid rgba(188,208,255,.2);
      border-radius:12px;
      background:rgba(15,25,43,.9);
      box-shadow:inset 0 0 12px rgba(99,215,255,.08);
      cursor:pointer;
      user-select:none;
      transition:.2s ease;
    }

    .room:hover{
      border-color:rgba(99,215,255,.42);
      transform:translateY(-1px);
    }

    .room.active{
      border-color:rgba(111,255,176,.6);
      box-shadow:0 0 14px rgba(111,255,176,.26);
      background:rgba(18,39,31,.9);
    }

    .room.red{
      border-color:rgba(255,93,122,.45);
      box-shadow:0 0 12px rgba(255,93,122,.28);
    }

    .r-cafeteria{left:6%; top:14%; width:22%; height:18%;}
    .r-reactor{left:38%; top:12%; width:22%; height:20%;}
    .r-skeld{right:7%; top:14%; width:20%; height:18%;}
    .r-upper{left:18%; bottom:18%; width:24%; height:22%;}
    .r-lower{right:18%; bottom:16%; width:26%; height:22%;}
    .r-vents{left:46%; bottom:27%; width:12%; height:12%;}

    .task-list{
      margin-top:8px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:260px;
      overflow:auto;
    }

    .task-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:9px 10px;
      border-radius:10px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.06);
      font-size:.85rem;
      color:var(--text);
    }

    .task*
