    let levelData = null;

    function setLevel(index) {
      const raw = levels[index];
      levelData = JSON.parse(JSON.stringify(raw));
      player.x = raw.player.x;
      player.y = raw.player.y;
      player.r = raw.player.r;

      player.vx = 0;
      player.vy = 0;

      game.level = index;
      game.won = false;
      game.over = false;
      game.message = "";
    }

    function resetLevel() {
      setLevel(game.level);
    }

    function nextLevel() {
      if (game.level < levels.length - 1) {
        setLevel(game.level + 1);
      } else {
        setLevel(0);
      }
    }

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function circleRectCollision(c, rect) {
      const closestX = clamp(c.x, rect.x, rect.x + rect.w);
      const closestY = clamp(c.y, rect.y, rect.y + rect.h);
      const dx = c.x - closestX;
      const dy = c.y - closestY;
      return dx * dx + dy * dy < c.r * c.r;
    }

    function resolveWall(rect) {
      const c = player;

      if (!circleRectCollision(c, rect)) return;

      const closestX = clamp(c.x, rect.x, rect.x + rect.w);
      const closestY = clamp(c.y, rect.y, rect.y + rect.h);

      const dx = c.x - closestX;
      const dy = c.y - closestY;
      const dist = Math.hypot(dx, dy) || 0.0001;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = c.r - dist;

      c.x += nx * overlap;
      c.y += ny * overlap;

      const dot = c.vx * nx + c.vy * ny;
      if (dot < 0) {
        c.vx -= 2 * dot * nx;
        c.vy -= 2 * dot * ny;
      }
    }
